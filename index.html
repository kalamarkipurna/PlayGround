 1:{chapter:'Chapter I · The call',title:'A light in the fen',art:'fen',text:'Rain ticks against your hood as the village of Bellwether disappears behind you. Ahead, the old road splits around a black-water marsh. Somewhere beyond it, the Starfall Beacon has gone dark—and the valley is forgetting the sun.',quote:'“If the last lantern dies, the long night comes for us all.” — Keeper Elowen',choices:[

function render(){const app=$('#app');app.innerHTML=state.screen==='setup'?setupView():gameView();bind();}
function setupView(){return `<section class="intro"><div><div class="eyebrow">A 10-minute fantasy adventure</div><h1>The Last Lantern</h1><p>A little choice-driven tale about courage, kindness, and a light that almost went out.</p></div><div class="step-pill">✧ &nbsp;YOUR STORY BEGINS</div></section><section class="setup-grid"><div class="panel choose-panel"><h2 class="section-title">Choose your wayfarer</h2><p class="section-note">Every hero brings a different spark to the story.</p><div class="role-list">${roles.map(r=>`<button class="role-card ${state.role===r.id?'selected':''}" data-role="${r.id}" aria-pressed="${state.role===r.id}"><span class="role-icon">${r.icon}</span><span class="role-name">${r.name}</span><span class="role-desc">${r.desc}</span></button>`).join('')}</div><div class="dice-row"><button class="dice-button" id="rollBtn"><span class="die">⚄</span> Roll for a hero</button><span class="dice-help">Let the dice decide your role.</span></div></div><article class="story-card"><svg class="scene-art" viewBox="0 0 700 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#182a42"/><stop offset=".65" stop-color="#475b69"/><stop offset="1" stop-color="#d08b67"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#334c59"/><stop offset="1" stop-color="#101e2b"/></linearGradient><radialGradient id="glow"><stop stop-color="#ffd783" stop-opacity=".8"/><stop offset="1" stop-color="#f5a651" stop-opacity="0"/></radialGradient></defs><rect width="700" height="520" fill="url(#sky)"/><circle cx="527" cy="110" r="100" fill="url(#glow)"/><circle cx="527" cy="110" r="27" fill="#ffe3ad"/><path d="M0 274 106 188l62 54 100-121 94 124 72-76 103 110 75-83 88 71v253H0Z" fill="#233748"/><path d="m414 274 16-157 16 157M416 181h30l-16-30Z" fill="#1b2a37"/><path d="M0 326q80-45 161 0t165 0q83-46 171 1t203-5v198H0Z" fill="url(#water)"/><path d="M0 382q110-31 212 4M356 402q104-42 344-6" fill="none" stroke="#a4a48f" stroke-opacity=".27" stroke-width="3"/><path d="M0 435q92-30 187 3m298-6q111-34 215-3" fill="none" stroke="#dfb47d" stroke-opacity=".29" stroke-width="2"/><path d="M36 356q35-57 71-2l-15-56 38 62M634 359q-31-54-67 0l11-48-33 56" fill="#12232c"/><path d="M324 345q36-73 68 0l-18-51 42 57" fill="#172a31"/><path d="M346 332h24v34h-24z" fill="#df9b55"/><circle cx="357" cy="335" r="22" fill="url(#glow)"/><path d="M351 318h12v28h-12z" fill="#ffd98d"/><ellipse cx="356" cy="456" rx="115" ry="13" fill="#091521" opacity=".55"/></svg><div class="story-top"><span class="chapter-tag">A tale of small lights</span><span class="moon-tag">☾</span></div><div class="story-copy"><h2>When the sun forgot to rise</h2><p>Beyond the village, an ancient beacon is fading. The valley’s last warm light is yours to protect.</p><div class="story-meta"><span>✦ &nbsp;3 chapters</span><span>◷ &nbsp;One brave little tale</span></div></div></article></section><div class="start-row"><span class="start-hint">Pick a role—or leave it to fate.</span><button class="primary-btn" id="startBtn" ${state.role?'':'disabled'}>Begin your adventure &nbsp;→</button></div>`;}
function sceneArt(kind){if(kind==='fen')return `<svg viewBox="0 0 900 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g1" x2="0" y2="1"><stop stop-color="#263a50"/><stop offset="1" stop-color="#71807b"/></linearGradient></defs><rect width="900" height="360" fill="url(#g1)"/><circle cx="700" cy="85" r="50" fill="#f0d4a0" opacity=".82"/><path d="M0 211 105 145l79 58 110-101 89 106 94-57 126 80 114-64 183 49v144H0Z" fill="#253b45"/><path d="M0 265q90-30 186 5t192-5q106-35 206 4t316-3v94H0Z" fill="#172b33"/><path d="M94 350q20-107 41-195m7 187q34-104 32-171m-7 169q55-84 69-150m460 148q-22-99-9-180m39 180q-9-79 22-150m42 145q-18-79 13-118" stroke="#8d9678" stroke-width="6" fill="none" opacity=".65"/><path d="M340 282q55-40 115 0" stroke="#d5b67e" stroke-width="3" opacity=".6" fill="none"/></svg>`;if(kind==='bridge')return `<svg viewBox="0 0 900 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g2" x2="0" y2="1"><stop stop-color="#34495d"/><stop offset="1" stop-color="#1b2735"/></linearGradient></defs><rect width="900" height="360" fill="url(#g2)"/><circle cx="168" cy="76" r="45" fill="#e9c98e" opacity=".78"/><path d="M0 172 92 94l75 70 100-94 83 105 98-78 93 86 110-115 82 91 89-58 78 78v181H0Z" fill="#243747"/><path d="M0 285h900v75H0" fill="#111c29"/><path d="M70 274Q450 158 830 274" fill="none" stroke="#c5a778" stroke-width="17"/><path d="M70 274Q450 158 830 274" fill="none" stroke="#6e6a5e" stroke-width="4"/><path d="M0 321q130-35 264 0t250-3q140-31 386 3" fill="none" stroke="#677980" stroke-width="7" opacity=".4"/><path d="M440 247v-45h16v45" fill="#edc982"/><circle cx="448" cy="198" r="16" fill="#edc982" opacity=".5"/></svg>`;return `<svg viewBox="0 0 900 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g3" x2="0" y2="1"><stop stop-color="#17273d"/><stop offset="1" stop-color="#a56d5c"/></linearGradient><radialGradient id="g4"><stop stop-color="#ffe7a7" stop-opacity=".9"/><stop offset="1" stop-color="#ffc45b" stop-opacity="0"/></radialGradient></defs><rect width="900" height="360" fill="url(#g3)"/><circle cx="708" cy="67" r="108" fill="url(#g4)"/><circle cx="708" cy="67" r="24" fill="#ffdfa0"/><path d="M0 250 142 175l94 45 110-108 92 121 98-71 115 90 91-50 158 52v106H0Z" fill="#283b48"/><path d="M360 301V147l88-70 89 70v154Z" fill="#263441" stroke="#998269" stroke-width="5"/><path d="M342 150 448 59l107 91" fill="none" stroke="#bea070" stroke-width="9"/><path d="M422 301V202h53v99" fill="#152330"/><path d="M397 183h19m62 0h19" stroke="#efcb82" stroke-width="8"/><path d="M443 119h11v59h-11z" fill="#ffdc89"/><circle cx="448" cy="118" r="32" fill="url(#g4)"/><path d="M0 310q130-32 240 3t243-2q126-30 417 5v44H0Z" fill="#15232d"/></svg>`;}
function gameView(){if(state.screen==='ending')return endingView();const scene=scenes[state.step],role=roles.find(r=>r.id===state.role);return `<section class="intro"><div><div class="eyebrow">A choice-driven fantasy tale</div><h1>The Last Lantern</h1><p>Your choices shape the light that returns to Bellwether.</p></div><div class="step-pill">✧ &nbsp;CHAPTER ${state.step} OF 3</div></section><section class="game-layout"><article class="panel game-main"><div class="game-art">${sceneArt(scene.art)}<span class="art-caption">${scene.chapter}</span></div><div class="narrative"><div class="chapter-line">${scene.chapter}</div><h2>${scene.title}</h2><p>${scene.text}</p><p class="quote">${scene.quote}</p>${state.lastResult?`<p class="quote" style="font-style:normal!important;color:#597b65!important;border-color:#79a17b">${state.lastResult}</p>`:''}<div class="choices-label">What will you do?</div><div class="choice-list">${scene.choices.map((c,i)=>`<button class="choice-btn" data-choice="${i}"><span class="choice-icon">${c.icon}</span><span class="choice-text"><b>${c.title}</b><small>${c.sub}</small></span></button>`).join('')}</div></div></article><aside class="sidebar"><section class="panel side-panel"><div class="adventurer-head"><div class="avatar">${role.icon}</div><div><h3>${role.name}</h3><p>${role.trait} · Level 1 wayfarer</p></div></div><div class="divider"></div><div class="stat-label"><span>VITALITY</span><span>${state.health} / ${state.maxHealth}</span></div><div class="health-track"><div class="health-fill ${state.health<=2?'low':''}" style="width:${state.health/state.maxHealth*100}%"></div></div><div class="health-note">You can always finish the tale.</div><div class="divider"></div><div class="stat-grid"><div class="stat-chip"><span>Kindness</span><b>✦ ${state.hope}</b></div><div class="stat-chip"><span>Renown</span><b>♛ ${state.renown}</b></div></div><div class="divider"></div><div class="inventory-title">In your satchel</div><div class="inventory">${state.items.length?state.items.map(i=>`<span class="item-chip">${i}</span>`).join(''):'<span class="item-chip">Just a lantern</span>'}</div></section><section class="panel side-panel"><div class="inventory-title">The journey</div><div class="progress-list">${['The call','The crossing','The beacon'].map((x,i)=>`<div class="progress-item ${state.step===i+1?'active':state.step>i+1?'done':''}"><span class="progress-num">${state.step>i+1?'✓':i+1}</span>${x}</div>`).join('')}</div></section><section class="panel side-panel"><div class="side-quote">“Even a small light can show the way home.”<small>— Wayfarer’s saying</small></div></section></aside></section>`;}
function endingData(){const acts=state.history.map(h=>h.kind);let score=state.hope+(state.health-state.maxHealth)+(state.role==='arcanist'?1:0)+(acts.includes('rescue')?1:0)+(acts.includes('kind')?1:0);if(state.role==='trickster'&&acts.includes('clever'))score++;if(score>=4)return {icon:'☀',title:'The Dawnbringer',stamp:'A bright new beginning',text:'The beacon flares like a second sunrise. The long night breaks, and warm gold spills over every rooftop in Bellwether. Keeper Elowen says your name will be told whenever the lanterns are lit. You didn’t just save the valley—you reminded it how to hope.'};if(score>=2)return {icon:'✦',title:'The Keeper’s Promise',stamp:'A light worth keeping',text:'A steady star shines above Bellwether once more. It is not the blazing sun of old, but a kinder, gentler light—and the valley gathers beneath it, safe for another generation. The keeper leaves you a place beside the beacon, should you ever wish to return.'};if(score>=0)return {icon:'♧',title:'A Lantern in the Dark',stamp:'The valley endures',text:'The beacon catches, sputters, then holds. Its light is small, but it is enough to guide the people of Bellwether through the night. You leave at dawn with tired feet, a full heart, and the knowledge that small acts can carry a long way.'};return {icon:'☾',title:'The Long Road Home',stamp:'Not every light is lost',text:'The beacon’s glow remains faint, and the valley must learn to make its own light for a while. But you brought Keeper Elowen home, and she will not let hope go dark. Your road is not over; somewhere beyond the hills, another story is already beginning.'};}
function endingView(){const data=endingData(),role=roles.find(r=>r.id===state.role),recap=state.history.map(h=>h.title);return `<section class="intro"><div><div class="eyebrow">Your story has found its ending</div><h1>The Last Lantern</h1><p>Every choice left its mark. Here’s the tale you made together.</p></div><div class="step-pill">✧ &nbsp;THE END</div></section><section class="panel ending"><div class="ending-badge">${data.icon}</div><div class="chapter-line">Your ending</div><h2>${data.title}</h2><span class="ending-stamp">${data.stamp}</span><p style="margin-top:18px">${data.text}</p><p style="margin-top:13px;font-size:11px;color:#92928c">As ${role.name}, you chose to ${recap.join(', then ')}. Your kindness: ${state.hope} · Renown: ${state.renown} · Keepsakes found: ${state.items.length}.</p><div class="choice-list"><div class="stat-chip"><span>Wayfarer</span><b>${role.icon} ${role.name}</b></div><div class="stat-chip"><span>Story keepsakes</span><b>${state.items.length?state.items.join(' · '):'Just a lantern'}</b></div></div><button class="primary-btn" id="againBtn">Begin another tale &nbsp;↻</button></section>`;}
function bind(){document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>{state.role=b.dataset.role;render()}));const roll=$('#rollBtn');if(roll)roll.addEventListener('click',()=>{roll.classList.remove('rolling');void roll.offsetWidth;roll.classList.add('rolling');const index=Math.floor(Math.random()*roles.length);state.role=roles[index].id;render();showToast(`The dice chose ${roles[index].name}!`)});const start=$('#startBtn');if(start)start.addEventListener('click',begin);document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.choice))));const again=$('#againBtn');if(again)again.addEventListener('click',reset);}
function begin(){if(!state.role)return;const role=roles.find(r=>r.id===state.role);state.screen='game';state.maxHealth=role.health;state.health=role.health;state.step=1;state.hope=0;state.renown=0;state.items=[];state.history=[];state.lastResult='';render();window.scrollTo({top:0,behavior:'smooth'});}
function choose(index){const scene=scenes[state.step],choice=scene.choices[index];if(!choice)return;let effect={...choice.effect};const role=state.role;if(scene.art==='fen'&&role==='ranger'&&effect.health<0){effect.health=0;effect.item='Marsh-glass';}if(choice.kind==='brave'&&role==='warden')effect.health=0;if(choice.kind==='clever'&&role==='trickster')effect.renown=(effect.renown||0)+1;if(choice.kind==='name'&&role==='arcanist')effect.hope=(effect.hope||0)+1;state.health=Math.max(1,Math.min(state.maxHealth,state.health+(effect.health||0)));state.hope+=effect.hope||0;state.renown+=effect.renown||0;if(effect.item&&!state.items.includes(effect.item))state.items.push(effect.item);state.history.push({kind:choice.kind,title:choice.title});state.lastResult=choice.result;if(choice.to===4){state.finalChoice=choice.kind;state.screen='ending';}else state.step=choice.to;render();window.scrollTo({top:0,behavior:'smooth'});}
function reset(){state={screen:'setup',role:null,health:4,maxHealth:4,hope:0,renown:0,items:[],step:1,history:[],lastResult:'',finalChoice:null};render();window.scrollTo({top:0,behavior:'smooth'});}
function showToast(message){const toast=$('#toast');toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2100);}
function openHelp(){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><h2 id="helpTitle">A few words before you go</h2><p><strong>The Last Lantern</strong> is a tiny roleplaying adventure. Pick one of four wayfarers, or roll the die and let fate choose.</p><ul><li>Read each scene and choose the action that feels right.</li><li>Your choices change your keepsakes, vitality, and the ending.</li><li>Some heroes have a special edge in certain moments.</li><li>There are no wrong answers—and you can play again to find another ending.</li></ul><button class="primary-btn modal-close" id="closeHelp">Back to the story</button></section></div>`;$('#closeHelp').addEventListener('click',()=>root.innerHTML='');$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')root.innerHTML=''});$('#closeHelp').focus();}
$('#helpBtn').addEventListener('click',openHelp);$('#resetBtn').addEventListener('click',()=>{if(state.screen==='setup')return;reset();showToast('A fresh page, a new adventure.');});render();
</script>
